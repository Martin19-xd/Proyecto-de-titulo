<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Guard · Revisa tu enlace</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>

<body>
  <header>
    <div class="brand">
      <span class="shield" aria-hidden="true">✓</span>
      <span>URL Guard</span>
    </div>
  </header>

  <main>
    <h1>¿Es seguro el enlace que recibiste?</h1>
    <p class="intro">Revisa si presenta señales de peligro antes de abrirlo.</p>

    <form id="form">
      <label for="url">Pega aquí el enlace que quieres revisar</label>

      <div class="controls">
        <input
          id="url"
          name="url"
          type="text"
          inputmode="url"
          maxlength="4096"
          placeholder="https://ejemplo.cl"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          aria-describedby="input-help"
          required
        >
        <button id="submit" type="submit">Revisar enlace</button>
      </div>

      <small id="input-help">URL Guard revisa la dirección sin abrir el sitio.</small>
    </form>

    <p id="status" role="status"></p>
    <p id="error" role="alert"></p>

    <section
      id="result"
      aria-labelledby="message"
      aria-describedby="probability advice"
      tabindex="-1"
      hidden
    >
      <p class="caption">Resultado de la revisión</p>

      <div class="headline">
        <span id="symbol" aria-hidden="true"></span>
        <h2 id="message"></h2>
      </div>

      <div class="scale" aria-hidden="true">
        <div class="track">
          <span id="marker"></span>
        </div>

        <div class="labels">
          <span>Bajo</span>
          <span>Moderado</span>
          <span>Alto</span>
        </div>
      </div>

      <p id="probability"></p>
      <p id="advice"></p>
      <p id="warning" hidden></p>
    </section>
  </main>
</body>
</html>
